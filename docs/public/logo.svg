<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A tiny bozzetto: a framed landscape under a low sun. -->
  <defs>
    <clipPath id="frame"><rect x="6" y="10" width="52" height="44" rx="7" /></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6cc" />
      <stop offset="1" stop-color="#f1f3ee" />
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="6" y="10" width="52" height="44" fill="url(#sky)" />
    <circle cx="42" cy="25" r="6" fill="#f2c14e" />
    <path d="M6 42 Q 22 30 36 38 T 58 34 V 54 H 6 Z" fill="#6aa58f" />
    <path d="M6 48 Q 30 38 58 46 V 54 H 6 Z" fill="#2f6b58" />
  </g>
  <rect x="6" y="10" width="52" height="44" rx="7" fill="none" stroke="#2f6b58" stroke-width="2.5" />
</svg>
